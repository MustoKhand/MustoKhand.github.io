<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mini GTA 2D</title>
<style>
:root{--bg:#1b1f2a;--fg:#f3efe2;--acc:#ff4d6d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#1b1f2a;--fg:#f3efe2}}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:Impact,"Arial Black",sans-serif;overflow:hidden}
canvas{display:block;width:100%;height:100%}
#hud{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:12px;font-size:22px;letter-spacing:1px;text-shadow:2px 2px 0 #000;pointer-events:none}
#help{position:absolute;bottom:calc(10px + env(safe-area-inset-bottom,0px));left:12px;font:13px Arial,sans-serif;opacity:.85;text-shadow:1px 1px 0 #000;pointer-events:none}
#msg{position:absolute;top:40%;width:100%;text-align:center;font-size:56px;color:var(--acc);text-shadow:3px 3px 0 #000;pointer-events:none;display:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"></div>
<div id="help">WASD / Oklar: hareket · E: arabaya bin/in · Space: ateş · R: yeniden başla</div>
<div id="msg"></div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
function rs(){cv.width=innerWidth;cv.height=innerHeight}rs();addEventListener('resize',rs);
const W=3000,H=3000,B=300; // map size, block size
const rnd=(a,b)=>a+Math.random()*(b-a);
const keys={};
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key==='e')toggleCar();if(e.key.toLowerCase()==='r')init();if(e.key===' ')e.preventDefault()});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
let P,cars,peds,bullets,cops,money,wanted,hp,dead,cam,fireT,msgT;
const buildings=[];
function init(){
  buildings.length=0;
  for(let x=0;x<W;x+=B)for(let y=0;y<H;y+=B){
    buildings.push({x:x+70,y:y+70,w:B-140,h:B-140,c:`hsl(${(x*7+y*3)%360},25%,${28+((x+y)/B)%3*6}%)`});
  }
  P={x:B/2,y:B/2,a:0,car:null,r:9};
  cars=[];for(let i=0;i<14;i++)spawnCar();
  peds=[];for(let i=0;i<40;i++)spawnPed();
  bullets=[];cops=[];money=0;wanted=0;hp=100;dead=false;fireT=0;msgT=0;
  cam={x:P.x,y:P.y};
  document.getElementById('msg').style.display='none';
}
function roadPoint(){
  const lane=Math.random()<.5;const k=Math.floor(rnd(0,W/B))*B;
  return lane?{x:rnd(0,W),y:k+B/2-10+0}:{x:k+B/2-10,y:rnd(0,H)};
}
// roads: gaps between buildings; centre of gap is block edge (x%B in [0,70)∪[B-70,B))
function onRoad(x,y){const mx=((x%B)+B)%B,my=((y%B)+B)%B;return mx<70||mx>B-70||my<70||my>B-70}
function spawnCar(){
  let x,y;do{x=rnd(0,W);y=rnd(0,H)}while(!onRoad(x,y)||Math.hypot(x-P.x,y-P.y)<200);
  cars.push({x,y,a:Math.random()*Math.PI*2,v:0,c:`hsl(${Math.floor(rnd(0,360))},70%,50%)`,ai:true,ta:0,hp:100});
}
function spawnPed(){
  let x,y;do{x=rnd(0,W);y=rnd(0,H)}while(!onRoad(x,y));
  peds.push({x,y,a:rnd(0,6.28),t:0,c:`hsl(${Math.floor(rnd(0,360))},60%,60%)`,dead:false,flee:0});
}
function hitB(x,y,r){for(const b of buildings){if(x+r>b.x&&x-r<b.x+b.w&&y+r>b.y&&y-r<b.y+b.h)return b}return null}
function toggleCar(){
  if(dead)return;
  if(P.car){const c=P.car;P.x=c.x+Math.cos(c.a+1.57)*28;P.y=c.y+Math.sin(c.a+1.57)*28;c.ai=false;P.car=null;return}
  let best=null,bd=50;for(const c of cars){const d=Math.hypot(c.x-P.x,c.y-P.y);if(d<bd){bd=d;best=c}}
  if(best){P.car=best;best.ai=false;best.v=0;if(!best.stolenCounted){best.stolenCounted=true;wanted=Math.min(5,wanted+1);msg('ARABA ÇALINDI!')}}
}
function msg(t){const m=document.getElementById('msg');m.textContent=t;m.style.display='block';msgT=90}
function update(){
  if(dead)return;
  const up=keys['w']||keys['arrowup'],dn=keys['s']||keys['arrowdown'],lf=keys['a']||keys['arrowleft'],rt=keys['d']||keys['arrowright'];
  if(P.car){
    const c=P.car;
    if(up)c.v=Math.min(c.v+.18,7);else if(dn)c.v=Math.max(c.v-.2,-3);else c.v*=.97;
    const steer=(lf?-1:0)+(rt?1:0);c.a+=steer*.045*Math.min(1,Math.abs(c.v)/3)*Math.sign(c.v||1);
    moveCar(c);P.x=c.x;P.y=c.y;
  }else{
    let dx=(rt?1:0)-(lf?1:0),dy=(dn?1:0)-(up?1:0);
    if(dx||dy){const l=Math.hypot(dx,dy);dx/=l;dy/=l;P.a=Math.atan2(dy,dx);
      const nx=P.x+dx*2.6,ny=P.y+dy*2.6;
      if(!hitB(nx,P.y,P.r))P.x=nx;if(!hitB(P.x,ny,P.r))P.y=ny}
  }
  P.x=Math.max(10,Math.min(W-10,P.x));P.y=Math.max(10,Math.min(H-10,P.y));
  // shoot
  fireT--;
  if(keys[' ']&&fireT<=0&&!P.car){fireT=10;bullets.push({x:P.x,y:P.y,vx:Math.cos(P.a)*12,vy:Math.sin(P.a)*12,l:50,own:1});if(wanted<1)wanted=1}
  // cars AI
  for(const c of cars){
    if(c===P.car)continue;
    if(c.ai){
      c.ta--;if(c.ta<=0){c.ta=rnd(60,200);c.da=Math.round(rnd(0,4))*Math.PI/2}
      let d=c.da-c.a;d=Math.atan2(Math.sin(d),Math.cos(d));c.a+=d*.04;
      c.v=Math.min(c.v+.08,2.6+(c.cop?1.5:0));
      const ox=c.x,oy=c.y;moveCar(c);if(Math.hypot(c.x-ox,c.y-oy)<.5)c.ta=0;
    }else{c.v*=.95;moveCar(c)}
    // run over by car
    if(P.car&&c!==P.car&&Math.hypot(c.x-P.x,c.y-P.y)<26){const s=Math.abs(P.car.v);if(s>2){c.hp-=s*3;P.car.v*=.6;hp-=0}}
  }
  // peds
  for(const p of peds){
    if(p.dead)continue;
    p.t--;if(p.t<=0){p.t=rnd(40,120);p.a+=rnd(-1.5,1.5)}
    const sp=p.flee>0?2.2:.7;p.flee--;
    const nx=p.x+Math.cos(p.a)*sp,ny=p.y+Math.sin(p.a)*sp;
    if(hitB(nx,ny,5))p.a+=3.14;else{p.x=nx;p.y=ny}
    if(P.car&&Math.abs(P.car.v)>1.5&&Math.hypot(p.x-P.x,p.y-P.y)<20)killPed(p);
    if(Math.hypot(p.x-P.x,p.y-P.y)<120&&wanted>0)p.flee=60;
  }
  // bullets
  for(const b of bullets){
    b.x+=b.vx;b.y+=b.vy;b.l--;
    if(hitB(b.x,b.y,1))b.l=0;
    if(b.own){
      for(const p of peds)if(!p.dead&&Math.hypot(p.x-b.x,p.y-b.y)<9){killPed(p);b.l=0}
      for(const c of cops)if(c.hp>0&&Math.hypot(c.x-b.x,c.y-b.y)<11){c.hp-=34;b.l=0;if(c.hp<=0){money+=500;if(wanted>0&&Math.random()<.4)wanted--}}
    }else if(!P.car?Math.hypot(P.x-b.x,P.y-b.y)<10:Math.hypot(P.x-b.x,P.y-b.y)<18){hp-=6;b.l=0}
  }
  bullets=bullets.filter(b=>b.l>0);
  // cops
  const want=wanted*2;
  if(cops.filter(c=>c.hp>0).length<want&&Math.random()<.02){
    const ang=rnd(0,6.28);let x=P.x+Math.cos(ang)*450,y=P.y+Math.sin(ang)*450;
    if(x>0&&x<W&&y>0&&y<H&&onRoad(x,y))cops.push({x,y,hp:100,t:0});
  }
  for(const c of cops){
    if(c.hp<=0)continue;
    const a=Math.atan2(P.y-c.y,P.x-c.x),d=Math.hypot(P.x-c.x,P.y-c.y);
    if(d>130){const nx=c.x+Math.cos(a)*1.9,ny=c.y+Math.sin(a)*1.9;
      if(!hitB(nx,c.y,8))c.x=nx;else c.y+=Math.sin(a)*1.9;
      if(!hitB(c.x,ny,8))c.y=ny;else c.x+=Math.cos(a)*1.9}
    c.a=a;c.t--;
    if(c.t<=0&&d<320){c.t=45;bullets.push({x:c.x,y:c.y,vx:Math.cos(a)*9,vy:Math.sin(a)*9,l:50,own:0})}
  }
  cops=cops.filter(c=>c.hp>0||(c.dt=(c.dt||0)+1)<200);
  if(wanted>0&&cops.filter(c=>c.hp>0).length===0&&Math.random()<.002)wanted--;
  if(hp<=0){dead=true;msg('BUSTED!  R ile tekrar dene')}
  cam.x+=(P.x-cam.x)*.1;cam.y+=(P.y-cam.y)*.1;
  if(msgT>0&&--msgT===0&&!dead)document.getElementById('msg').style.display='none';
  // car destroyed
  for(let i=cars.length-1;i>=0;i--)if(cars[i].hp<=0&&cars[i]!==P.car){cars.splice(i,1);spawnCar()}
  document.getElementById('hud').innerHTML='$'+money+' &nbsp; ❤ '+Math.max(0,Math.round(hp))+' &nbsp; '+'★'.repeat(wanted)+'☆'.repeat(5-wanted);
}
function killPed(p){if(p.dead)return;p.dead=true;money+=100;if(wanted<2)wanted=Math.max(wanted,1)}
function moveCar(c){
  const nx=c.x+Math.cos(c.a)*c.v,ny=c.y+Math.sin(c.a)*c.v;
  if(hitB(nx,ny,12)){c.v*=-.3;if(c===P.car)hp-=Math.abs(c.v)*1}else{c.x=nx;c.y=ny}
  c.x=Math.max(10,Math.min(W-10,c.x));c.y=Math.max(10,Math.min(H-10,c.y));
}
function draw(){
  const w=cv.width,h=cv.height,ox=w/2-cam.x,oy=h/2-cam.y;
  ctx.fillStyle='#3a3f4b';ctx.fillRect(0,0,w,h);
  ctx.save();ctx.translate(ox,oy);
  // roads markings
  ctx.fillStyle='#4a505e';ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='#e8d36a';ctx.lineWidth=3;ctx.setLineDash([22,22]);
  for(let k=0;k<=W;k+=B){
    ctx.beginPath();ctx.moveTo(k,0);ctx.lineTo(k,H);ctx.stroke();
    ctx.beginPath();ctx.moveTo(0,k);ctx.lineTo(W,k);ctx.stroke();
  }
  ctx.setLineDash([]);
  for(const b of buildings){
    if(b.x>cam.x+w/2||b.x+b.w<cam.x-w/2||b.y>cam.y+h/2||b.y+b.h<cam.y-h/2)continue;
    ctx.fillStyle='#22252d';ctx.fillRect(b.x+6,b.y+6,b.w,b.h);
    ctx.fillStyle=b.c;ctx.fillRect(b.x,b.y,b.w,b.h);
    ctx.fillStyle='rgba(255,255,255,.08)';
    for(let i=15;i<b.w-10;i+=30)for(let j=15;j<b.h-10;j+=30)ctx.fillRect(b.x+i,b.y+j,12,12);
  }
  for(const p of peds){
    if(p.dead){ctx.fillStyle='#8a1f2e';ctx.beginPath();ctx.arc(p.x,p.y,6,0,6.28);ctx.fill();continue}
    ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,5,0,6.28);ctx.fill();
  }
  for(const c of cars){
    ctx.save();ctx.translate(c.x,c.y);ctx.rotate(c.a);
    ctx.fillStyle='rgba(0,0,0,.3)';ctx.fillRect(-17,-9,38,22);
    ctx.fillStyle=c.c;ctx.fillRect(-20,-11,40,22);
    ctx.fillStyle='#9fd4ff';ctx.fillRect(2,-8,10,16);
    ctx.fillStyle='#222';ctx.fillRect(-20,-11,4,22);
    ctx.fillStyle='#fff7a8';ctx.fillRect(18,-9,3,5);ctx.fillRect(18,4,3,5);
    ctx.restore();
  }
  for(const c of cops){
    if(c.hp<=0){ctx.fillStyle='#223';ctx.beginPath();ctx.arc(c.x,c.y,7,0,6.28);ctx.fill();continue}
    ctx.fillStyle='#1e3a8a';ctx.beginPath();ctx.arc(c.x,c.y,9,0,6.28);ctx.fill();
    ctx.fillStyle=(Date.now()>>7)%2?'#ff3b3b':'#3b6bff';ctx.beginPath();ctx.arc(c.x,c.y,4,0,6.28);ctx.fill();
  }
  if(!P.car){
    ctx.fillStyle='#ffd166';ctx.beginPath();ctx.arc(P.x,P.y,P.r,0,6.28);ctx.fill();
    ctx.strokeStyle='#111';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(P.x,P.y);ctx.lineTo(P.x+Math.cos(P.a)*16,P.y+Math.sin(P.a)*16);ctx.stroke();
  }
  ctx.fillStyle='#fff';
  for(const b of bullets){ctx.fillStyle=b.own?'#fff':'#ff6b6b';ctx.fillRect(b.x-2,b.y-2,4,4)}
  ctx.restore();
  // minimap
  const mw=110,mx=w-mw-12,my=12,s=mw/W;
  ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(mx,my,mw,mw);
  ctx.fillStyle='#555';for(const b of buildings)ctx.fillRect(mx+b.x*s,my+b.y*s,b.w*s,b.h*s);
  ctx.fillStyle='#3b6bff';for(const c of cops)if(c.hp>0)ctx.fillRect(mx+c.x*s-1,my+c.y*s-1,3,3);
  ctx.fillStyle='#ffd166';ctx.fillRect(mx+P.x*s-2,my+P.y*s-2,4,4);
}
function loop(){update();draw();requestAnimationFrame(loop)}
init();loop();
</script>
</body>
</html>
